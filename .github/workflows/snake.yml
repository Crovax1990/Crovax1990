name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create dist directory
        run: mkdir -p dist

      - name: Generate trophy (primary)
        run: curl -sS -o dist/github-profile-trophy.svg "https://github-profile-trophy-orcin-eta.vercel.app/?username=Crovax1990&theme=tokyonight&no-frame=true"

      - name: Generate trophy (fallback)
        if: failure()
        run: curl -sS -o dist/github-profile-trophy.svg "https://github-profile-trophy-unserori.vercel.app/?username=Crovax1990&theme=tokyonight&no-frame=true"

      - name: Generate stats card
        run: curl -sS -o dist/github-stats.svg "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=Crovax1990&theme=tokyonight"

      - name: Generate streak stats
        run: curl -sS -o dist/github-streak-stats.svg "https://streak-stats.demolab.com?user=Crovax1990&theme=tokyonight&hide_border=true"

      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Crovax1990
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
