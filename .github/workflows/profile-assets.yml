name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-assets.yml"
      - "scripts/generate_snake.py"

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create dist directory
        run: mkdir -p dist

      - name: Generate streak stats
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 \
            -o dist/github-streak-stats-matrix.svg \
            "https://streak-stats.demolab.com?user=Crovax1990&hide_border=true&disable_animations=true&background=050805&ring=00FF41&fire=00FF41&currStreakNum=00FF41&sideNums=9DFFB0&currStreakLabel=00FF41&sideLabels=9DFFB0&dates=4E9A5B&stroke=0A3A1B"

      - name: Generate activity snake
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/generate_snake.py \
            --user Crovax1990 \
            --output dist/github-activity-snake-matrix-dark.svg \
            --theme matrix \
            --frame
          python3 scripts/generate_snake.py \
            --user Crovax1990 \
            --output dist/github-activity-snake-matrix-light.svg \
            --theme matrix-light \
            --frame

      - name: Validate generated assets
        run: |
          set -euo pipefail
          for f in dist/*.svg; do
            test -s "$f"
            test "$(stat -c%s "$f")" -gt 512
            grep -q "<svg" "$f"
          done
          ls -lh dist

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
