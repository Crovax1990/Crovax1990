<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-labelledby="title desc">
  <title id="title">Luca Gobbi — Software Architect</title>
  <desc id="desc">Matrix-style profile header. Cloud-agnostic platforms, event-driven architecture, OpenTelemetry metrics, LLM embedding and inference.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="798" height="278" rx="8"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020402" stop-opacity="0.98"/>
      <stop offset="0.58" stop-color="#020402" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#020402" stop-opacity="0.20"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.35" r="0.72">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00ff41" opacity="0.035"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .rain { animation: fall 14s linear infinite; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes fall { from { transform: translateY(-60px); } to { transform: translateY(340px); } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .rain, .blink { animation: none; } }
    </style>
  </defs>

